version: 2

models:
  - name: mapa_municipios_corte
    description: >
      Una fila por municipio de DIVIPOLA para el mapa (TASK-09). Contrato de la API:
      docs/design/pages/map/contract.md.
    columns:
      - name: cod_mpio
        data_tests: [unique, not_null]
      - name: tipo
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [municipio, area_no_municipalizada, isla]
      - name: iso_3166_2
        description: Todo departamento de DIVIPOLA debe tener su código ISO 3166-2.
        data_tests: [not_null]
      - name: contratos_ubicados
        description: Null cuando no hay contratos ubicados en la ventana; nunca 0.
        data_tests:
          - mayor_que_cero

  - name: mapa_niveles_corte
    description: >
      Contratos del corte por nivel territorial (municipio, departamento, sin lugar) y
      departamento, para el mapa de dos niveles (TASK-09).
    data_tests:
      - unique_combination:
          arguments:
            columns: [nivel, cod_dpto]
    columns:
      - name: nivel
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [municipio, departamento, sin_lugar]
      - name: cod_dpto
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_divipola')
                field: cod_dpto
      - name: contratos
        data_tests: [not_null, mayor_que_cero]

  - name: resumen_gasto_cuipo
    description: >
      Gasto público (CUIPO) por territorio, año, vigencia y rubro. Contrato de la API:
      docs/design/pages/resumen-municipal/contract.md. La ausencia de datos es falta de fila
      o null, nunca cero.
    data_tests:
      - unique_combination:
          arguments:
            columns: [nivel, cod_dpto, cod_mpio, anio, vigencia, rubro]
    columns:
      - name: nivel
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [municipio, departamento]
      - name: rubro
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [funcionamiento, deuda, inversion]
      - name: vigencia
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3]
                quote: false
      - name: cod_dpto
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_divipola')
                field: cod_dpto
      - name: cod_mpio
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_divipola')
                field: cod_mpio
      - name: anio
        description: Sin gasto antes de 2023, cuando CUIPO empieza a publicar.
        data_tests:
          - not_null
          - anio_desde_2023

  - name: resumen_municipal
    description: >
      Contratos firmados por municipio y año de firma (SECOP), separados del gasto de CUIPO.
      Solo hay fila donde hay contratos.
    data_tests:
      - unique_combination:
          arguments:
            columns: [cod_mpio, anio]
    columns:
      - name: contratos
        data_tests: [not_null, mayor_que_cero]
      - name: valor_contratado
        description: Null cuando todos los valores del año son atípicos; nunca 0.
        data_tests:
          - mayor_que_cero

  - name: resumen_departamento
    description: Contratos firmados por departamento y año de firma (SECOP), sin gasto.
    data_tests:
      - unique_combination:
          arguments:
            columns: [cod_dpto, anio]
    columns:
      - name: cod_dpto
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_divipola')
                field: cod_dpto
      - name: contratos
        data_tests: [not_null, mayor_que_cero]
