ekou:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('EKOU_DATA_DIR', 'data') }}/ekou.duckdb"
      threads: 2
      settings:
        # Límites explícitos: el corte nacional (~28 M filas) no cabe en memoria y DuckDB
        # usa disco temporal. Sin estos valores, el límite de temporales se calcula mal.
        memory_limit: "{{ env_var('EKOU_DUCKDB_MEMORY', '6GB') }}"
        max_temp_directory_size: "{{ env_var('EKOU_DUCKDB_TEMP', '20GiB') }}"
        preserve_insertion_order: false
      plugins:
        # Registra ekou_seudonimo(): HMAC-SHA256 con la clave EKOU_PSEUDONYM_KEY.
        - module: ekou_pipeline.dbt_plugin
