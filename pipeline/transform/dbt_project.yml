name: ekou
version: "0.1.0"
config-version: 2
profile: ekou

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]

vars:
  # Los fija el comando `ekou-pipeline transform`; estos valores solo sirven para desarrollo.
  corte: "2026-11"
  data_dir: "data"

models:
  ekou:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    silver:
      +materialized: table
    gold:
      +materialized: table

seeds:
  ekou:
    alias_municipios:
      +column_types: {cod_dpto: varchar, cod_mpio: varchar}
    alias_departamentos:
      +column_types: {cod_dpto: varchar}
