name: corte-mensual

# Extrae, transforma y publica el corte mensual de contratación pública (ADR 0002, decisión 4).
# extract → transform (pruebas de dbt) → compuertas de calidad → export → R2 + Release.
# Cada ejecución queda pública en la pestaña Actions; cada corte aprobado, en R2 y en un Release.

on:
  schedule:
    # Día 1 de cada mes, 11:17 UTC (06:17 en Colombia): después del reemplazo diario de
    # SECOP II Contratos en origen (~07:43 UTC), para que la extracción termine antes del siguiente.
    - cron: "17 11 1 * *"
  workflow_dispatch:
    inputs:
      corte:
        description: "Corte AAAA-MM (vacío: el mes actual)"
        required: false
        default: ""
      publicar:
        description: "Publicar el Release del corte (solo desde main)"
        type: boolean
        default: true

permissions:
  contents: read

# Nunca dos cortes a la vez: compiten por la API y por la caché de bronze.
concurrency:
  group: corte-mensual
  cancel-in-progress: false

defaults:
  run:
    working-directory: pipeline

jobs:
  corte:
    name: corte ${{ inputs.corte || 'del mes' }}
    runs-on: ubuntu-latest
    # El límite de GitHub es 6 h; se deja margen para guardar la caché y avisar si falla.
    timeout-minutes: 340
    permissions:
      contents: write # crear el Release del corte
      issues: write # abrir un issue si el corte falla
    env:
      EKOU_PSEUDONYM_KEY: ${{ secrets.EKOU_PSEUDONYM_KEY }}
      # Runner estándar: 4 CPU, 16 GB de RAM. Lo que no cabe en memoria va a disco temporal.
      EKOU_DUCKDB_MEMORY: 10GB
      EKOU_DUCKDB_TEMP: 20GiB
      FUENTES: secop_contratos secop_procesos secop_ubicaciones secop_i divipola
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: corte a procesar
        id: corte
        env:
          CORTE_INPUT: ${{ inputs.corte }}
        run: |
          corte="${CORTE_INPUT:-$(date -u +%Y-%m)}"
          if ! [[ "$corte" =~ ^[0-9]{4}-(0[1-9]|1[0-2])$ ]]; then
            echo "::error::el corte debe tener el formato AAAA-MM: '$corte'"
            exit 1
          fi
          echo "corte=$corte" >> "$GITHUB_OUTPUT"
          echo "Corte: $corte" >> "$GITHUB_STEP_SUMMARY"
        working-directory: .

      - name: App Token de datos.gov.co (opcional)
        env:
          TOKEN: ${{ secrets.EKOU_SOCRATA_APP_TOKEN }}
        run: |
          # Un token vacío se enviaría como cabecera vacía: solo se exporta si existe.
          if [[ -n "$TOKEN" ]]; then
            echo "EKOU_SOCRATA_APP_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          else
            echo "::warning::sin EKOU_SOCRATA_APP_TOKEN: la API aplica límites más estrictos"
          fi
        working-directory: .

      - name: liberar disco
        # El corte necesita ~35 GB (bronze, base DuckDB y temporales); el runner trae ~14 GB libres.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /
        working-directory: .

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - run: uv sync --locked --no-dev

      - name: restaurar bronze del corte
        # Si un intento anterior del mismo corte se cortó, solo se extraen las particiones que faltan.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pipeline/data/bronze/corte=${{ steps.corte.outputs.corte }}
          key: bronze-${{ steps.corte.outputs.corte }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: bronze-${{ steps.corte.outputs.corte }}-

      - name: extraer
        id: extraer
        # Medido: ~2 h sin App Token. El límite deja tiempo para guardar lo extraído si se agota.
        timeout-minutes: 270
        run: |
          mkdir -p data
          uv run ekou-pipeline extract $FUENTES --corte "${{ steps.corte.outputs.corte }}" \
            > data/reporte-extraccion.json

      - name: guardar bronze del corte
        if: always() && steps.extraer.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pipeline/data/bronze/corte=${{ steps.corte.outputs.corte }}
          key: bronze-${{ steps.corte.outputs.corte }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: transformar y probar
        # Si una prueba de datos falla, termina con código 1 y el corte no se publica.
        run: uv run ekou-pipeline transform --corte "${{ steps.corte.outputs.corte }}"

      - name: calidad del corte anterior
        id: anterior
        env:
          CORTE: ${{ steps.corte.outputs.corte }}
          GH_REPO: ${{ github.repository }}
        run: |
          # El Release más reciente de un corte anterior a este; si no hay, no se compara.
          tag=$(gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep -E '^corte-[0-9]{4}-[0-9]{2}$' | sort -r \
            | awk -v actual="corte-$CORTE" '$0 < actual' | head -n 1 || true)
          if [[ -z "$tag" ]]; then
            echo "Sin corte anterior publicado: solo se aplican los umbrales absolutos."
            exit 0
          fi
          gh release download "$tag" --pattern calidad_corte.csv --output data/calidad_corte_anterior.csv
          echo "ruta=data/calidad_corte_anterior.csv" >> "$GITHUB_OUTPUT"
          echo "Se compara contra $tag."

      - name: compuertas de calidad
        # Si la cobertura cae bajo el umbral o frente al corte anterior, el corte no se publica.
        env:
          ANTERIOR: ${{ steps.anterior.outputs.ruta }}
        run: |
          uv run ekou-pipeline compuertas --corte "${{ steps.corte.outputs.corte }}" \
            ${ANTERIOR:+--anterior "$ANTERIOR"} | tee -a "$GITHUB_STEP_SUMMARY"

      - name: exportar
        run: |
          uv run ekou-pipeline export --corte "${{ steps.corte.outputs.corte }}"
          cp data/reporte-extraccion.json "data/publicacion/${{ steps.corte.outputs.corte }}/"
          ls -lh "data/publicacion/${{ steps.corte.outputs.corte }}"
          cat "data/publicacion/${{ steps.corte.outputs.corte }}/resumen.md" >> "$GITHUB_STEP_SUMMARY"

      - name: publicar en R2
        # Lo que consume la app: rutas versionadas inmutables y un puntero latest.json con caché
        # corta (ADR 0002, decisión 6.2).
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.publicar)
        env:
          CORTE: ${{ steps.corte.outputs.corte }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 no acepta las sumas de verificación que la CLI de AWS envía por defecto.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          if [[ -z "$R2_ACCOUNT_ID" || -z "$R2_BUCKET" || -z "$AWS_ACCESS_KEY_ID" ]]; then
            echo "::warning::R2 sin configurar (secretos R2_*): el corte solo se publica en el Release"
            exit 0
          fi
          s3() { aws s3 --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" "$@"; }
          dir="data/publicacion/$CORTE"
          for archivo in mapa_municipios.json calidad_corte.json; do
            s3 cp "$dir/$archivo" "s3://$R2_BUCKET/datos/$CORTE/$archivo" \
              --content-type application/json \
              --cache-control "public, max-age=31536000, immutable"
          done

          # Reprocesar un mes viejo no debe mover el puntero hacia atrás.
          vigente=$(s3 cp "s3://$R2_BUCKET/datos/latest.json" - 2>/dev/null | jq -r '.corte // ""' || true)
          if [[ -n "$vigente" && "$vigente" > "$CORTE" ]]; then
            echo "latest.json se queda en $vigente (más reciente que $CORTE)."
            exit 0
          fi
          jq -n --arg corte "$CORTE" --arg publicado "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{
            corte: $corte,
            publicado: $publicado,
            archivos: {
              mapa_municipios: "datos/\($corte)/mapa_municipios.json",
              calidad_corte: "datos/\($corte)/calidad_corte.json"
            }
          }' > latest.json
          s3 cp latest.json "s3://$R2_BUCKET/datos/latest.json" \
            --content-type application/json \
            --cache-control "public, max-age=300, stale-while-revalidate=86400"

      - name: publicar Release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.publicar)
        env:
          CORTE: ${{ steps.corte.outputs.corte }}
          GH_REPO: ${{ github.repository }}
        run: |
          dir="data/publicacion/$CORTE"
          tag="corte-$CORTE"
          notas="$dir/resumen.md"
          printf '\nEjecución: %s/%s/actions/runs/%s\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$notas"
          if gh release view "$tag" > /dev/null 2>&1; then
            # Reproceso del mismo mes: el corte es idempotente, se reemplazan sus archivos.
            gh release upload "$tag" "$dir"/* --clobber
            gh release edit "$tag" --notes-file "$notas"
          else
            gh release create "$tag" "$dir"/* --title "Corte $CORTE" \
              --notes-file "$notas" --target "$GITHUB_SHA"
          fi

      - name: registros de la ejecución
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registros-${{ steps.corte.outputs.corte }}-${{ github.run_attempt }}
          path: |
            pipeline/data/reporte-extraccion.json
            pipeline/data/dbt/logs/
          if-no-files-found: ignore
          retention-days: 90

      - name: avisar del fallo
        if: failure() && github.event_name == 'schedule'
        env:
          CORTE: ${{ steps.corte.outputs.corte }}
          GH_REPO: ${{ github.repository }}
        run: |
          titulo="Falló el corte mensual $CORTE"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cuerpo="La ejecución programada del corte $CORTE falló (extracción, pruebas de datos o compuertas de calidad) y no se publicó. Se mantiene el corte anterior.

          Registros: $url

          Para reintentar: Actions → corte-mensual → Run workflow con corte \`$CORTE\`. Solo se extraen las particiones que falten."
          existente=$(gh issue list --state open --search "\"$titulo\" in:title" --json number --jq '.[0].number')
          if [[ -n "$existente" ]]; then
            gh issue comment "$existente" --body "$cuerpo"
          else
            gh issue create --title "$titulo" --body "$cuerpo" --label bug
          fi
        working-directory: .
